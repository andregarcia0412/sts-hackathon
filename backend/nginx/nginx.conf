# Reverse proxy in front of the FastAPI back-end (service "api" of docker-compose.yml).
# Single entry point on port 80; the API itself is only reachable inside the compose network.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent $request_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # JSON answers (analysis trees, graphs, reports) compress well
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json text/csv text/plain text/css application/javascript;

    upstream api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Project upload: a .zip package may hold up to 200 MB (projects/importer.py)
        client_max_body_size 200m;
        # Stream uploads straight to the API instead of spooling them to disk first
        proxy_request_buffering off;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # Chatbot, debate and contestation reanalysis wait on the LLM
            # (OLLAMA_TIMEOUT_S=180 per attempt, with retries)
            proxy_connect_timeout 10s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }

        # Liveness of the proxy itself (the API has its own healthcheck)
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
    }
}
