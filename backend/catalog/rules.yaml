rules:
- id: NOV-W1
  criterion: novidade
  block: web
  mode: regra
  what: Fixar a data de referência = início do projeto; só é estado da arte o que estava acessível ao
    público antes dela
  evidence: data de início (FORMP&D 3.1.11) + data de publicação de cada resultado
  sources:
  - LPI art. 11 §1º
  - INPI Res. 169/2016 itens 3.1 e 3.3
  - HMRC GfC3 parte 2 passo 5
  - IE TDM §8.1(e)
  routing:
  - evidencias/cronologia.csv
  chk: CHK-TEMPO
  polarity_hint: informativa
  scoring_role: informativa
  status: aplicavel
  status_reason: null
  absorbed_into: null
- id: NOV-W2
  criterion: novidade
  block: web
  mode: web
  what: 'Buscar em três frentes: patentes, literatura científica e soluções de mercado/concorrentes'
  evidence: lista de bases consultadas por frente
  sources:
  - IT MIMIT 2024 §1.1.3.1
  - AU R&DTI
  routing: []
  polarity_hint: informativa
  scoring_role: informativa
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Para o elemento novo declarado no metodo.md#2, monte e execute um plano de busca em três frentes:

    (1) patentes — query com termos do mecanismo e classe IPC/CPC se aplicável (G06F, H04L, G06Q 40);

    (2) literatura científica — query em PT e EN com sinônimos técnicos;

    (3) mercado — query sobre a solução/setor.

    Registra, para cada frente, a base, a string usada e quantos resultados voltaram (NOV-W8).

    Achados posteriores à data de referência do projeto não são estado da arte.'
  query_family: plano de busca
- id: NOV-W3
  criterion: novidade
  block: web
  mode: web
  what: Comparar o elemento novo declarado (o conhecimento/técnica, não o produto) com o documento mais
    próximo; um único documento que descreva o elemento inteiro derruba a novidade
  evidence: documento mais próximo + quadro 'o que o projeto tem que o achado não tem'
  sources:
  - Frascati §2.16
  - INPI itens 4.6 e 4.10
  - EPO G-VII 5 etapa (i)
  routing: []
  polarity_hint: negative
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'A partir do elemento novo declarado no metodo.md#2, busque o documento público mais próximo
    dele.

    Se um único resultado já descrever o elemento inteiro (o mecanismo, não só o resultado), a novidade

    não está demonstrada — registra a evidência contrária com o trecho do achado (quote da fonte web).

    Se nada cobrir o elemento, registra o achado mais próximo e o que falta nele.

    IMPORTANTE: achar a técnica GENÉRICA na web não derruba a novidade se o mecanismo específico do

    recorte não estiver descrito no achado.'
  query_family: documento mais próximo
- id: NOV-W4
  criterion: novidade
  block: web
  mode: web
  what: 'Comparar com o setor/campo, não com a empresa: algo que já existe no mercado mas é novo para
    a empresa NÃO é novo'
  evidence: ausência de uso da solução por outros atores do setor
  sources:
  - Frascati §2.15
  - UK DSIT ¶6 ¶20 ¶22
  - IE TDM §3.4
  - FAQ MCTI P4(a)
  routing: []
  polarity_hint: negative
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Busque indícios de que a solução já era usada por outros atores do setor (bancos/fintechs para

    projetos financeiros). Achado de uso setorial = evidência contrária; ausência de achado é registrada

    com peso menor — nunca como prova de novidade.'
  query_family: uso setorial
- id: NOV-W5
  criterion: novidade
  block: web
  mode: web
  what: Se outra empresa já chegou ao resultado mas o COMO não é público (segredo industrial), a novidade
    se mantém
  evidence: ausência de documentação pública sobre o método
  sources:
  - UK DSIT ¶11 ¶21
  - IE TDM §3.4
  - IT MIMIT §1.1.3.1
  routing: []
  polarity_hint: positive
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Busque se o resultado (a função) já aparece publicamente e verifique se o MÉTODO está público.

    Resultado público + método secreto = novidade se mantém. Registra o achado e se ele descreve

    o como ou só o resultado.'
  query_family: resultado público vs método
- id: NOV-W6
  criterion: novidade
  block: web
  mode: web
  what: Trabalho simultâneo e independente de concorrentes não elimina a novidade, se os resultados deles
    não estavam acessíveis
  evidence: datas das publicações dos concorrentes vs. início do projeto
  sources:
  - UK DSIT ¶21
  - IE TDM §3.4
  - IT MIMIT §1.1.3.1
  routing: []
  polarity_hint: positive
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Compare a data de publicação dos achados com a data de referência do projeto (primeiro evento

    da cronologia). Achado posterior é trabalho simultâneo — não derruba a novidade; registra a data.

    Achado anterior é estado da técnica.'
  query_family: datas de publicação
- id: NOV-W7
  criterion: novidade
  block: web
  mode: web
  what: Página da internet conta como estado da técnica se pode ser achada por buscador público e continuou
    acessível
  evidence: URL + data de publicação ou de captura
  sources:
  - INPI Res. 169/2016 item 3.33
  routing: []
  polarity_hint: informativa
  scoring_role: informativa
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Para cada achado usado, registra a URL e a data de captura (dia de hoje) — define a admissibilidade

    da evidência web no grafo. Achado sem data confiável = ''data indeterminada'' (não conta como anterior

    nem posterior).'
  query_family: admissibilidade
- id: NOV-W8
  criterion: novidade
  block: web
  mode: web+regra
  what: 'Registrar a busca de forma reproduzível: bases, data, string exata, filtros, nº de resultados,
    selecionados e por quê'
  evidence: log de busca (vira nó do grafo)
  sources:
  - PRISMA-S (Rethlefsen et al. 2021)
  - WIPO Pub. 946
  routing: []
  polarity_hint: informativa
  scoring_role: informativa
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Não gera evidência própria: o log de busca é gerado automaticamente pelo sistema para toda
    query

    que você executar. Confere apenas que você registrou, para cada regra web que rodou, quantas queries

    fez e quantos achados selecionou.'
  query_family: log de busca
- id: NOV-D1
  criterion: novidade
  block: documento
  mode: llm
  what: 'O projeto declara explicitamente o elemento novo: a tecnologia, as novas funcionalidades/características
    e a aplicação'
  evidence: texto do campo 3.1.7 ou do relatório técnico
  sources:
  - FORMP&D 3.1.7
  - Guia MCTI 2020 §6.2
  - FAQ MCTI P4(a) e (c)
  routing:
  - evidencias/metodo.md#2
  polarity_hint: positive
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'No §2 ''Mecanismo e hipótese'' do metodo.md, identifique a declaração de elemento novo do projeto.

    O que a equipe afirma ser novo? Cite literalmente o trecho que descreve o mecanismo/hipótese. Se o

    documento não declara elemento novo (só adequação de configuração), registre evidência contrária.'
- id: NOV-D2
  criterion: novidade
  block: documento
  mode: llm
  what: 'O projeto descreve o estado da arte no início: alternativas conhecidas e o modo de falha específico
    de cada uma; só lista de ferramentas → novidade indeterminada'
  evidence: seção de estado da arte (metodo.md#1) com alternativa + limitação, datada
  sources:
  - Guia MCTI 2020 §6.2
  - IT MIMIT §1.1.3.1
  - IE TDM §8.1(e)
  - Históricos PRJ02/03/05/06/13-16/18 × PRJ08
  routing:
  - evidencias/metodo.md#1
  polarity_hint: positive
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'No §1 ''Referência anterior'' do metodo.md, verifique se o projeto descreve alternativas conhecidas

    E onde cada uma falha no problema estudado. Alternativa + limitação = sustenta. Lista de ferramentas

    sem modo de falha → registra neutra com a limitação. Sem referência anterior → sem evidência.'
- id: NOV-D3
  criterion: novidade
  block: documento
  mode: llm
  what: A novidade é de conhecimento/técnica (o 'como'), não de funcionalidade, negócio ou mercado
  evidence: trechos que explicam o problema técnico e a abordagem
  sources:
  - FAQ MCTI P4
  - Frascati §2.16 e Tab. 2.1(a)
  - Guia MCTI 2020 §6.1
  routing:
  - evidencias/metodo.md#2
  polarity_hint: positive
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Analise se o elemento novo declarado é conhecimento/técnica (como fazer) ou apenas funcionalidade/

    negócio. Cite o trecho que mostra o mecanismo técnico. Funcionalidade sem mecanismo → contrária.'
- id: NOV-D4
  criterion: novidade
  block: documento
  mode: llm
  what: Não é cópia, imitação, engenharia reversa, compra de tecnologia nem nacionalização/adaptação sem
    barreira técnica
  evidence: origem da solução; contratos de licença ou aquisição
  sources:
  - Frascati §2.15
  - UK DSIT ¶12 ¶22 ¶24
  - Guia ANPEI 2017 pp. 19 e 26
  - Guia MCTI 2020 Ap. B.3
  routing:
  - evidencias/metodo.md#1
  - evidencias/metodo.md#2
  chk: CHK-CONFIG
  polarity_hint: negative
  scoring_role: gate
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Use o resultado da checagem CHK-CONFIG (via tool chk_resultado). Se a referência anterior do
    §1 é

    manual/catálogo/produto contratado que já fornece a função aplicada no §2, a solução é adaptação de

    tecnologia existente → contrária. Cite o trecho do §1/§2 que mostra a origem da solução.'
- id: NOV-D5
  criterion: novidade
  block: documento
  mode: llm
  what: 'Software: não cai nas exclusões (sistema de negócio com métodos conhecidos, funcionalidade de
    usuário, ferramentas prontas, customização, depuração rotineira)'
  evidence: técnica/arquitetura descrita vs. lista de exclusões
  sources:
  - Frascati §2.70–2.72
  - IPCTN 2020 Anexo I
  routing:
  - evidencias/metodo.md#1
  - evidencias/metodo.md#2
  polarity_hint: negative
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Compare o mecanismo do §2 contra as exclusões de software: sistema de negócio com métodos conhecidos,

    funcionalidade de usuário, site com ferramentas prontas, customização, depuração rotineira. Cite o

    trecho do §2 que caracteriza o mecanismo. Se o mecanismo é configuração/uso de ferramenta pronta →

    contrária; se descreve técnica própria → sustenta.'
- id: NOV-D6
  criterion: novidade
  block: documento
  mode: regra
  what: 'A melhoria é substancial e objetiva: há comparação com a linha de base; melhora numérica entre
    versões SOZINHA não basta (rotina também melhora)'
  evidence: métricas antes/depois, benchmark
  sources:
  - Decreto 5.798 art. 2º II 'c'
  - Guia MCTI 2020 Ap. B.1
  - UK DSIT ¶23–25
  - IT MIMIT §1.1.3.1
  - Histórico PRJ01 8/12→12/12 só mudando retenção
  routing:
  - evidencias/medicoes.csv
  - evidencias/resultados.csv
  chk: CHK-RECALC
  polarity_hint: positive
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Use o resultado da CHK-RECALC (via tool chk_resultado) sobre a comparação entre versões. A
    regra:

    melhora numérica entre versões sozinha não demonstra novidade — rotina também melhora. Só registra

    evidência sustentando se houver comparação qualitativa além da melhora numérica.'
- id: NOV-D8
  criterion: novidade
  block: documento
  mode: regra
  what: Patente, registro de software, artigo ou aprovação por agência de fomento são indícios — não obrigatórios
  evidence: nº do pedido/registro, DOI, termo de outorga
  sources:
  - IT MIMIT §1.1.3.1
  - Frascati Tab. 2.1(d)
  - Guia ANPEI 2017 Fig. 1
  routing: []
  polarity_hint: positive
  scoring_role: informativa
  status: na
  status_reason: N/A no pacote — não há patentes, registros ou artigos nos artefatos
  absorbed_into: null
- id: NOV-D10
  criterion: novidade
  block: documento
  mode: regra+llm
  what: Se a referência anterior — manual, catálogo, dicionário ou produto contratado, datado antes do
    projeto — já fornece a função aplicada, a novidade não está demonstrada
  evidence: referência anterior + data (cronologia) + mecanismo do §2
  sources:
  - Históricos PRJ01 (BARR-2), PRJ04, 09, 11, 12, 19, 20
  - Frascati §2.72
  routing:
  - evidencias/metodo.md#1
  - evidencias/metodo.md#2
  chk: CHK-CONFIG
  polarity_hint: negative
  scoring_role: gate
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Combine o resultado da CHK-CONFIG com as datas da CHK-TEMPO (tools chk_resultado). Passo a
    passo:

    (1) a referência do §1 é manual/catálogo/produto contratado? (2) ela é datada antes do início do

    projeto? (3) o §2 aplica a função que ela já fornece? Se sim nos três → novidade NÃO demonstrada,

    evidência contrária citando o trecho do §1 e do §2. Se algum passo falha → neutra explicando.'
- id: NOV-D11
  criterion: novidade
  block: documento
  mode: llm
  what: A novidade vale no recorte ensaiado (perfis, cenários, cargas); afirmações gerais além dele não
    são cobertas
  evidence: seção 'Limite da conclusão' (metodo.md#6)
  sources:
  - Históricos PRJ02, 05, 07, 14
  - LEIA_ME
  routing:
  - evidencias/metodo.md#6
  chk: CHK-ESCOPO
  polarity_hint: positive
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'No §6 ''Limite da conclusão'', identifique o recorte da novidade. Cite o trecho que delimita
    onde a

    conclusão vale. A regra apenas delimita — não é positiva nem negativa por si; registre a polaridade

    neutra com a citação do limite.'
- id: NOV-D12
  criterion: novidade
  block: documento
  mode: llm
  what: Título ou adjetivo comercial não prova novidade — decide o mecanismo documentado; técnica genérica
    só conta com elemento técnico próprio testado contra o comparador
  evidence: mecanismo do §2 vs. título do dossiê
  sources:
  - Históricos PRJ09, PRJ19, PRJ02
  - T13
  routing:
  - dossie_projeto.pdf
  - evidencias/metodo.md#2
  chk: CHK-VERSOES
  polarity_hint: positive
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Compare o título do dossiê (fragmento 1) com o mecanismo do §2. O título/adjetivo não prova
    nada;

    o mecanismo é o que decide. Se o §2 descreve técnica genérica sem elemento próprio testado contra

    o comparador → contrária. Se há elemento próprio além do título → sustenta citando o mecanismo.'
- id: CRI-W1
  criterion: criatividade
  block: web
  mode: web+llm
  what: 'Aplicar o roteiro problema-solução EPO: achar o estado da arte mais próximo, definir o problema
    técnico, verificar se um técnico chegaria à solução de forma óbvia'
  evidence: documento mais próximo + problema técnico + justificativa da não-obviedade
  sources:
  - EPO G-VII 5
  - INPI Res. 169/2016 itens 5.9–5.21
  - LPI art. 13
  - Guia MCTI 2020 §6
  routing: []
  polarity_hint: negative
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Reaproveite o achado mais próximo da NOV-W3 (se disponível no contexto) e derive o problema
    técnico

    objetivo. Depois: um técnico no assunto chegaria à solução do projeto de forma óbvia? A justificativa

    de não-obviedade é sinal, não veredito. Cite o trecho do achado e a justificativa.'
  query_family: problema-solução EPO
- id: CRI-W2
  criterion: criatividade
  block: web
  mode: web+llm
  what: Se a abordagem do projeto aparece como prática padrão (documentação oficial, tutorial, manual),
    é rotina
  evidence: link do material que descreve a mesma abordagem
  sources:
  - Guia do desafio Parte 4
  - Frascati §2.72
  routing: []
  chk: CHK-CONFIG
  polarity_hint: negative
  scoring_role: gate
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'A configuração do §2 aparece em documentação oficial ou tutorial? Busque (1–2 queries) a prática

    descrita no mecanismo. Achado que descreve a mesma abordagem como prática padrão → contrária (gate).

    Use também o resultado da CHK-CONFIG (tool chk_resultado).'
  query_family: prática padrão/tutorial
- id: CRI-W3
  criterion: criatividade
  block: web
  mode: llm+regra
  what: Combinação de elementos conhecidos só é criativa se o efeito conjunto vai além da soma dos efeitos
    isolados; justaposição simples é óbvia
  evidence: comparação dos efeitos isolados vs. combinados
  sources:
  - INPI itens 5.22 e 5.30
  routing:
  - evidencias/medicoes.csv
  polarity_hint: negative
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'O §2 vs. comparadores isolados — as estratégias alternativas medidas estão no medicoes.csv?
    (tool

    buscar_em_arquivos). Combinação com efeito além da soma → sustenta; justaposição → contrária.'
- id: CRI-W4
  criterion: criatividade
  block: web
  mode: llm
  what: Trazer conhecimento de outro campo conta quando a adaptação não era facilmente dedutível
  evidence: origem do conhecimento + o que precisou ser adaptado
  sources:
  - UK DSIT ¶6 e ¶23
  - IT MIMIT 2024 §1.1.3.2
  - Frascati Tab. 2.1(b)
  routing:
  - evidencias/metodo.md#1
  - evidencias/metodo.md#2
  polarity_hint: positive
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Procure no §1/§2 indícios de conhecimento importado de outro campo e o que precisou ser adaptado.

    Cite o trecho. Sem indício → sem evidência (não contrária).'
- id: CRI-W5
  criterion: criatividade
  block: web
  mode: web
  what: 'Indícios a favor: o problema era conhecido há tempo e não resolvido, ou o projeto seguiu caminho
    contrário ao consenso técnico'
  evidence: literatura relatando o problema em aberto ou o consenso contrariado
  sources:
  - INPI itens 5.57 e 5.58
  routing: []
  polarity_hint: positive
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Busque (1–2 queries) literatura ou relatórios mostrando o problema técnico SEM solução conhecida
    ou

    um consenso técnico contrariado. Achado → sustenta com o trecho. Nada → sem evidência.'
  query_family: problema em aberto
- id: CRI-D1
  criterion: criatividade
  block: documento
  mode: regra+llm
  what: Há hipótese explícita (ideia ou abordagem para superar a barreira), registrada antes dos testes
  evidence: plano, ata ou relatório datado com a hipótese
  sources:
  - Guia MCTI 2020 §6.2
  - CRA SR&ED
  - AU R&DTI
  - IE TDM §8.1(f)
  routing:
  - evidencias/metodo.md#2
  chk: CHK-TEMPO
  polarity_hint: positive
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Duas partes: (1) REGRA — use a CHK-TEMPO (tool chk_resultado): o evento ''Registro do problema
    e das

    referências'' (documento-inicial) é anterior aos ensaios? (2) LLM — no §2, identifique a hipótese

    explícita e cite-a. Hipótese + registro anterior → sustenta; hipótese sem data anterior → neutra;

    sem hipótese → contrária.'
- id: CRI-D2
  criterion: criatividade
  block: documento
  mode: llm
  what: Há obstáculo técnico que exigiu solução original, descrito de forma concreta
  evidence: campo 3.1.8 (barreira) / relatório técnico
  sources:
  - IT MIMIT §1.1.3.2
  - Guia MCTI 2020 §6.3
  - FORMP&D 3.1.8
  routing:
  - dossie_projeto.pdf
  - atividades.csv
  polarity_hint: positive
  scoring_role: mean
  status: aplicavel
  status_reason: null
  absorbed_into: null
  prompt: 'Na pergunta registrada do dossiê e na fase ''Caracterização do problema'' do atividades.csv,
    identifique

    o obstáculo técnico concreto. Cite o trecho. Barreira descrita em termos de mercado/cliente →

    contrária; sem menção → sem evidência.'
- id: CRI-D3
  criterion: criatividade
  block: documento
  mode: regra
  what: A equipe inclui pesquisador — e dá para saber quem formulou a hipótese, com qual qualificação
    e dedicação
